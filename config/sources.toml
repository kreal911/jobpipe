# ------------------------------------------------------------------
# Job boards to poll.
#
# Every entry below was tested on 2026-08-25 against the exact URL its
# adapter calls. The posting count in each comment is what came back.
# Re-check any time with:
#     python3 -m jobpipe verify
#
# How to find the token for a company:
#   Greenhouse  boards.greenhouse.io/<TOKEN>       or job-boards.greenhouse.io/<TOKEN>
#   Lever       jobs.lever.co/<SLUG>
#   Ashby       jobs.ashbyhq.com/<BOARD>
#   SmartRecr.  jobs.smartrecruiters.com/<COMPANY_ID>
#   Workday     <TENANT>.<dc>.myworkdayjobs.com/en-US/<SITE>
#               -> host = "<TENANT>.<dc>.myworkdayjobs.com"
# Open the careers link and read the URL you land on.
#
# NOTE on SmartRecruiters: its API returns HTTP 200 for ANY company id,
# including nonsense ones. A source is only real if totalFound > 0.
# ------------------------------------------------------------------


