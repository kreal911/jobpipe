# ---------------------------------------------------------------- answers
[answers]
work_authorization   = "U.S. Citizen"        # stated on the current resume
requires_sponsorship = "No"                  # follows from U.S. citizenship
security_clearance   = ""
# Rate is split because the two channels ask different questions and a single
# answer is wrong for one of them. Full-time boards want a salary; a staffing
# recruiter wants an hourly number in the FIRST reply, and "open - flexible"
# reads as no answer and stalls the submission.
salary_expectation   = "Open - flexible based on the full role and scope."   # full-time roles
contract_rate_c2c    = "$65/hr C2C, all inclusive"
# Evidence for the C2C number: right-to-represent signed with Stellent IT on
# 2026-08-27 for Sr. Portfolio Analyst EPMO at $65/hr C2C all inclusive, and
# confirmed verbally to Ishika Azad. Clevanoo TPM was agreed at $60/hr C2C,
# so treat 60 as the floor you have actually accepted and 65 as the ask.
contract_rate_w2     = "TODO"   # NOT derivable from the C2C number -- on W2 the
                                # employer carries taxes and burden, so the
                                # equivalent is materially lower. Recruiters ask
                                # this constantly; a guess here costs real money.
notice_period        = "None - available immediately."
earliest_start       = "Immediately"
willing_to_relocate  = "No - Los Angeles based; open to remote and to on-site anywhere in the LA metro, and to travel."
remote_preference    = "Remote; Los Angeles-based"   # from the resume header
