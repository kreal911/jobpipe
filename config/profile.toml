# ------------------------------------------------------------------
# Scoring profile. Nothing here is hidden: every point a job scores
# traces back to a term listed below, and the digest shows you which.
#
#   terms       = [["phrase", weight], ...]  title match x3, body match x1
#   require_any = gate. If none appear, that lane scores 0 for the job.
#   penalties   = subtract points (same title x3 rule)
#   target      = raw points that equal a score of 100 for that lane
#
# Tune with:  python3 -m jobpipe score --rescore && python3 -m jobpipe digest
# ------------------------------------------------------------------

[thresholds]
# Recalibrated 2026-08-25 against 6,685 real postings.
#
# The old 60/35 was set when the only data was the 13 fixture jobs, which
# score 106-110 because they are dense, boilerplate-free samples. Real
# postings are mostly company narrative, so the whole population sits lower:
# of ~2,000 postings with a full description, p90 = 29, p98 = 51, max = 65.
# At keep = 60 the entire live run produced 3 APPLY, which is not a digest.
#
# 50 lands just above p98 -> ~45 APPLY, a shortlist you can actually read.
# 30 lands near p90       -> ~128 LOOK.
# Re-check after any weight change with:
#   python3 -m jobpipe score --rescore && python3 -m jobpipe stats
keep  = 50      # digest section "APPLY"
maybe = 30      # digest section "LOOK"

[bonus]
remote      = 4
comp_posted = 3
fresh       = 5
fresh_days  = 7

[filters]
max_age_days = 45
allow_locations = [
  # "us" was removed 2026-08-25: several boards format every location as
  # "Orlando, FL, US" or "US - GA, Atlanta", so the bare token matched the
  # country suffix and let any state through. "united states"/"usa"/"remote"
  # still catch genuinely nationwide postings, and a multi-site posting like
  # "Riverwoods, IL, ..., McLean, VA" still passes on "mclean" -- which a
  # state-based deny list would have wrongly rejected.
  "remote", "united states", "usa", "nationwide", "anywhere",
  "los angeles", "california", "ca", "santa monica", "el segundo", "pasadena",
  "burbank", "glendale", "long beach", "irvine", "san diego", "orange county",
  "culver city", "torrance", "woodland hills",
  "washington", "dc", "district of columbia", "arlington", "mclean",
  "reston", "bethesda", "rockville", "alexandria", "virginia", "maryland",
  # DC-area sites that federal contractors post to but that were missing:
  "chantilly", "springfield", "herndon", "fairfax", "tysons", "quantico",
  "annapolis", "columbia", "silver spring", "college park", "aberdeen",
  # LA-area sites that appear as facility names rather than cities:
  "arcadia", "monterey park", "downey", "anaheim", "costa mesa", "santa ana",
  "manhattan beach", "beverly hills", "west hollywood", "marina del rey",
]

# Workday's list endpoint returns "2 Locations" instead of a city whenever a
# posting spans multiple offices, and some tenants return an empty string.
# That is an UNKNOWN location, not a disallowed one -- dropping it silently
# discarded 798 postings on the last run, most of them the Capital One,
# Elevance, Accenture and CACI roles this profile exists to find.
#
# When true, a posting whose location matches one of the patterns below
# survives the location gate and is judged on its content instead. The
# digest still prints the raw location, so an ambiguous one is visible.
# Set false to go back to dropping them.
treat_unknown_location_as_allowed = true
unknown_location_patterns = [
  '^\s*$',                 # empty
  '^\d+\s+locations?$',    # Workday's "2 Locations" placeholder
]
exclude_title = [
  "intern", "internship", "co-op", "apprentice", "junior", "entry level",
  "graduate", "new grad", "student", "part-time", "unpaid",
  "sdr", "bdr", "account executive", "sales development", "recruiter",
]
exclude_body = [
  "top secret", "ts/sci", "polygraph", "active security clearance",
]

# Checked against the location BEFORE allow_locations, and unlike that gate it
# is NOT skipped for remote postings. A board that flags "Remote - India" as
# remote=true otherwise bypasses the location check completely and can rank
# first. Deliberately omits "ontario" (Ontario, CA is LA-area) and "mexico"
# (matches "New Mexico").
exclude_locations = [
  "india", "bengaluru", "bangalore", "hyderabad", "chennai", "pune",
  "gurgaon", "noida", "mumbai", "delhi",
  "united kingdom", "london", "dublin", "ireland",
  "germany", "berlin", "munich", "france", "paris",
  "spain", "madrid", "barcelona", "italy", "milano", "milan", "roma", "rome",
  "torino", "netherlands", "amsterdam", "poland", "warsaw", "krakow",
  "japan", "tokyo", "singapore", "australia", "sydney", "melbourne",
  "canada", "toronto", "vancouver", "montreal",
  "brazil", "sao paulo", "philippines", "manila",
  "emea", "apac", "latam",
  # Added 2026-08-28 after a Cohere TPM role in Korea reached APPLY: a board
  # that flags a posting remote skips the allow gate, so only this list stops
  # it. Deliberately omits names that collide with US places -- georgia,
  # ontario, mexico, victoria, lebanon, peru, columbia.
  "korea", "seoul", "china", "beijing", "shanghai", "shenzhen", "taiwan",
  "hong kong", "malaysia", "kuala lumpur", "thailand", "bangkok", "vietnam",
  "hanoi", "indonesia", "jakarta", "new zealand", "auckland",
  "israel", "tel aviv", "united arab emirates", "dubai", "abu dhabi",
  "saudi arabia", "riyadh", "qatar", "egypt", "south africa", "nigeria",
  "kenya", "turkey", "istanbul", "greece", "athens", "portugal", "lisbon",
  "sweden", "stockholm", "norway", "oslo", "denmark", "copenhagen",
  "finland", "helsinki", "belgium", "brussels", "luxembourg",
  "switzerland", "zurich", "geneva", "austria", "vienna",
  "czech republic", "czechia", "prague", "hungary", "budapest",
  "romania", "bucharest", "bulgaria", "sofia", "ukraine", "kyiv",
  "argentina", "buenos aires", "chile", "santiago", "costa rica",
  "uruguay", "montevideo", "scotland", "edinburgh", "wales", "belfast",
]

