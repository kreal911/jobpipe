[[lanes]]
name        = "Program / Product Management (AI, regulated)"
# target was 65 while every other lane was 80-85, so identical raw points
# read ~30% higher here and this lane took all 68 "keep" slots. 85 puts the
# four lanes on one scale.
target      = 85
require_any = ["program manager", "product manager", "technical program", "delivery manager", "program management"]
# Second gate, TITLE only (require_any also searches the body, where every AI
# lab mentions "ai" and every employer mentions "compliance" -- so it cannot
# tell a Responsible AI TPM from a Reliability TPM).
#
# This lane is "Program / Product Management (AI, regulated)". Without this,
# it was any program manager anywhere, which is how it took 36 of 47 APPLY
# slots. Now the title has to say what the programme is actually about.
# "defense" and "data" were dropped 2026-08-25: every Anduril department
# reads "AFS : Air Defense Engineering", and "data" catches any
# data-platform team, so both waved through generic TPM roles that the gate
# exists to stop. Named AI/governance/regulated terms carry the lane instead.
require_title_any = [
  "ai", "artificial intelligence", "machine learning", "ml", "llm",
  "model risk", "model", "responsible ai", "governance", "risk", "compliance",
  "regulated", "audit", "quality", "healthcare", "health", "clinical",
  "medicare", "medicaid", "payer", "federal", "government", "public sector",
  "erp", "sap", "supply chain", "logistics", "security", "privacy",
]
# "technical program manager" and "program manager" both fire on the SAME
# title, so a bare TPM title used to bank (6+5)x3 = 33 points -- over half
# the old target -- before saying anything about AI, governance or health.
# The specific phrases keep their weight; the generic ones are cut so the
# title states the job family without deciding the ranking on its own.
terms = [
  ["technical program manager", 6], ["ai product manager", 6],
  ["program manager", 3], ["product manager", 3], ["delivery manager", 4],
  ["ai", 3], ["machine learning", 3], ["governance", 3], ["compliance", 3],
  ["healthcare", 3], ["federal", 3], ["government", 2], ["regulated", 3],
  ["stakeholder", 2], ["roadmap", 2], ["cross-functional", 2], ["risk", 2],
  ["vendor", 2], ["budget", 1], ["agile", 2], ["scrum", 2], ["erp", 2],
]
penalties = [["engineering manager", 3], ["people manager of engineers", 2]]
