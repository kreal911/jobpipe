name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  offline-harness:
    name: offline test harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm no third-party dependencies
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "Dependency file present. jobpipe is standard-library only by design."
            exit 1
          fi
          echo "standard library only - confirmed"

      - name: Run the offline harness
        run: python3 tests/test_pipeline.py
